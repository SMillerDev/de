<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.4/dist/leaflet.css"
        />
        <link rel="stylesheet" href="/css/style.css" />
        <title>🌍 Де... | Admin</title>
        <script type="importmap">
            {
                "imports": {
                    "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.4/dist/leaflet.js"
                }
            }
        </script>
    </head>
    <body>
        <main class="container-fluid">
            <form method="post">
                <label>
                    Name
                    <input name="name" value="" />
                </label>
                <label>
                    Prompt
                    <input name="prompt" value="" />
                </label>
                <label>
                    Play at
                    <input name="playat" type="date" value="{{ if .PlayAt.IsZero }}{{else}}{{ .PlayAt }}{{end}}" />
                </label>
                <label>
                    JSON
                    <textarea name="prompt" class="prompt">{}</textarea>
                    <small id="invalid-helper"></small>
                </label>
                <div id="map" class="admin-map" style="height: 100px"></div>

                <input type="submit" value="Save" />
            </form>
        </main>
        <script type="module" src="/js/admin.mjs"></script>
    </body>
</html>

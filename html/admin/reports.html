<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.css"
        />
        <link rel="stylesheet" href="/css/style.css" />
        <title>🌍 Де... | Admin</title>
        <script type="importmap">
            {
                "imports": {
                    "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.js"
                }
            }
        </script>
    </head>
    <body>
        <main class="container-fluid">
            <div id="map" style="height: 500px;"></div>
        </main>
        <script type="module">
            import {LeafletMap, TileLayer, GeoJSON} from 'leaflet';
            let item = {{ (index .Items 0).Answer }};
            let reports = {{ .Reports }};
            let data = reports.map((item) => [item["Coordinate"]["Lattitude"], item["Coordinate"]["Longitude"], 1]);

            const map = new LeafletMap("map").setView(
            	[49.574, 30.827],
            	6,
            );
            new TileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            	maxZoom: 19,
            	attribution:
            		'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            }).addTo(map);

            import {HeatLayer} from 'https://cdn.jsdelivr.net/npm/leaflet.heat@1.0.1/dist/leaflet-heat.js';
            const heat = new HeatLayer(data, {maxZoom: 10}).addTo(map);
            new GeoJSON(item).addTo(map);
        </script>
    </body>
</html>
